name: Claude Code Review

# The ONE automatic Claude review per PR (-> the `claude-review` check). Posts
# feedback as a PR comment using the repo's CLAUDE.md / AGENTS.md (if present).
# claude.yml is mention-only and does NOT auto-review, so Claude reviews each PR
# exactly once.
# Requires the Claude GitHub App + the CLAUDE_CODE_OAUTH_TOKEN repo secret.

on:
  pull_request:
    # opened + synchronize is the fleet default; reopened + ready_for_review are
    # kept from this repo's previous combined workflow so a PR that starts as a
    # draft still gets reviewed the moment it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: 'claude-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip fork PRs: they don't receive repo secrets, so the run would fail.
    # Skip PRs labeled 'trivial': the fleet's review opt-out tier.
    # Draft + dependabot skips are carried over from this repo's previous
    # combined workflow.
    if: |
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'trivial')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write   # needs write so `gh pr comment` can post the review
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1
        env:
          GH_TOKEN: ${{ github.token }}   # so the `gh pr comment` step authenticates
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            This is a Mintlify documentation site, so weight the review toward:
            - Correctness — broken links or anchors, MDX syntax errors,
              frontmatter mistakes, docs.json navigation entries that don't
              match added/renamed pages, and code samples that don't match the
              documented CLI or API behavior.
            - Security — leaked secrets or token values in examples,
              curl-pipe-to-shell install instructions, commands that would echo
              credentials. This project treats security as the highest priority.
            - Repo conventions — consistent Mintlify component usage,
              terminology consistent with the rest of the docs, and
              least-privilege defaults in any example configuration.

            Use the repository's CLAUDE.md / AGENTS.md (if present) for style and
            conventions.
            Be constructive and concise; skip purely stylistic nits.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
